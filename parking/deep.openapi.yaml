openapi: 3.0.0
info:
  version: v1.1
  title: Parking Deep Integration API's
  description: "Deep integration APIs for parking. Aeria handles the authorization and price calculation, while the partner handles the parking operations. v1.1 adds booking updates (extension/renewal), category-level bookings, a proactive vehicle settlement-status webhook (updateVehicleStatus), a cross-channel movement notification webhook (notifyMovements), a fastag collection mode, collection/gate fields on movement logs and log pulls, and online+offline movement reporting semantics — additive to v1, plus one correction: the addWhitelist* required lists previously referenced a nonexistent property (registeredVehicles) and now name the real field."
tags: 
  - name: Parking Operations
    description: APIs For Parking Operations
  - name: Webhook Operations
    description: APIs For Webhook Operations

components:
  parameters:
    signatureHeader:
      in: header
      name: x-signature
      required: true
      schema:
        type: string
  schemas:
    Vehicle:
      type: object
      properties:
        registrationNumber:
          type: string
          example: MH01AB1234
        type:
          type: string
          example: 4w
          anyOf:
            - type: string
              enum: [ 4w, 2w ]
        model:
          type: string
          example: Honda City
          nullable: true
        color:
          type: string
          example: red
          nullable: true
        fastagNo:
          type: string
          example: 12345
          nullable: true
        geotaagNo:
          type: string
          example: 12345
          nullable: true
      required:
        - registrationNumber
        - type
    Bay:
      type: object
      properties:
        name:
          type: string
          example: A-14
        location:
          type: string
          example: Green Zone, Basement 1
      required:
        - location
    Availability:
      type: object
      properties:
        total:
          type: number
          example: 10
        available:
          type: number
          example: 5
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Collection:
      type: object
      properties:
        amount:
          type: number
          example: 100
          description: The amount that was collected from the vehicle at the time of entry or exit
        mode:
          type: string
          example: cash
          description: Collection mode. Use fastag for FASTag-settled collections so central reconciliation can distinguish them.
          anyOf:
            - type: string
              enum: [ cash, card, upi, fastag, other ]
      required:
        - amount
        - mode
    ExitData:
      type: object
      properties:
        id:
          type: string
          example: 00000000-0000-0000-0000-000000000000
        entryTime:
          type: string
          example: 2022-01-01T00:00:00Z
        exitTime:
          type: string
          example: 2022-01-01T02:00:00Z
        totalFare:
          type: number
          example: 100
        preCollectedFare:
          type: number
          example: 50
        categoryId:
          type: string
          example: 00000000-0000-0000-0000-000000000000
        validTill:
          type: string
          example: 2022-01-01T00:00:00Z
          description: The time till which the total fare is valid. This is the time till which the vehicle can exit without incurring any additional charges.
    IntegrationNotFound:
      type: object
      properties:
        statusCode:
          type: integer
          example: 422
        response:
          type: object
          properties:
            message:
              type: string
              example: integration not found
            code:
              type: integer
              example: 710
    BarrierNotFound:
      type: object
      properties:
        statusCode:
          type: integer
          example: 422
        response:
          type: object
          properties:
            message:
              type: string
              example: barrier not found
            code:
              type: integer
              example: 711
    NoBayAvailable:
      type: object
      properties:
        statusCode:
          type: integer
          example: 410
        response:
          type: object
          properties:
            message:
              type: string
              example: No bay available
            code:
              type: integer
              example: 712
    NoParkingFound:
      type: object
      properties:
        statusCode:
          type: integer
          example: 406
        response:
          type: object
          properties:
            message:
              type: string
              example: No parking found for the integration
            code:
              type: integer
              example: 713
    VehicleNotWhitelisted:
      type: object
      properties:
        statusCode:
          type: integer
          example: 406
        response:
          type: object
          properties:
            message:
              type: string
              example: Vehicle is not whitelisted
            code:
              type: integer
              example: 714

  responses:
    Success:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
                example: 200
              response:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
                example: 401
              response:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized access
                  code:
                    type: integer
                    example: 401
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
                example: 403
              response:
                type: object
                properties:
                  message:
                    type: string
                    example: Forbidden access
                  code:
                    type: integer
                    example: 403
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
                example: 500
              response:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal Server Error
                  code:
                    type: integer
                    example: 500
    UnprocessableContent:
      description: Unprocessable Content
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/IntegrationNotFound'
              - $ref: '#/components/schemas/BarrierNotFound'
    DataNotFound:
      description: Data not found
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/NoParkingFound'
              - $ref: '#/components/schemas/VehicleNotWhitelisted'

    NoBayAvailable:
      description: No bay available
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
                example: 410
              response:
                $ref: '#/components/schemas/NoBayAvailable'
  
paths:
  /partner/v1/parking/category-availabilty:
    get:
      tags: 
        - Parking Operations
      summary: Api for getting category summary
      description: Api for getting category summary
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            4w:
                              $ref: '#/components/schemas/Availability'
                            2w:
                              $ref: '#/components/schemas/Availability'
                      defaultVisitorCategoryId:
                        type: string
                    example:
                      categories:
                        - id: 00000000-0000-0000-0000-000000000000
                          name: Tenant A
                          4w:
                            total: 10
                            available: 5
                          2w:
                            total: 10
                            available: 5
                        - id: 00000000-0000-0000-0000-000000000001
                          name: Visitor
                          4w:
                            total: 10
                            available: 5
                          2w:
                            total: 10
                            available: 5
                      defaultVisitorCategoryId: 00000000-0000-0000-0000-000000000001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422': 
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /partner/v1/parking/request-entry:
    post:
      tags: 
        - Parking Operations
      summary: Api for requesting entry of a vehicle
      description: Aeria will handle the authorization based category of the pre registered vehicle and the bay availability. For successful authorization, Aeria will send a bay detail to the partner that will be displayed on the screen at the entry. Idempotent replay — repeated requests for a vehicle whose entry is already pending or inside replay the prior decision instead of creating a new session.
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle:
                  $ref: '#/components/schemas/Vehicle'
                barrierId:
                  type: string
                  example: some-barrier-id
                idempotencyKey:
                  type: string
                  maxLength: 64
                  example: lane2-entry-000123
                  nullable: true
                  description: Optional partner-supplied idempotency key, unique within your integration — any stable pattern works. Re-submissions with the same idempotencyKey return the identical response. Without it, deduplication falls back to the natural key (vehicle with a pending/open session).
              required:
                - vehicle
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    required:
                      - id
                      - entryTime
                      - bay
                      - category
                    properties:
                      id:
                        type: string
                        example: 00000000-0000-0000-0000-000000000000
                      entryTime:
                        type: string
                        example: 2022-01-01T00:00:00Z
                      bay:
                        $ref: '#/components/schemas/Bay'
                      category: 
                        $ref: '#/components/schemas/Category'
                        example:
                          id: 00000000-0000-0000-0000-000000000000
                          name: Reserved
                      pendingCollectionAmount:
                        type: number
                        example: 0
                        description: The amount to be collected for the vehicle at the time of entry
                      paidUpto:
                        type: string
                        example: 2022-01-01T04:00:00Z
                        nullable: true
                        description: The time until which the session is settled, as of admission — far-future (e.g. 9999-12-31T23:59:59Z) means free exit (entitled/covered); absent means dues accrue from entry. Later changes are pushed via updateVehicleStatus.
                      validTill:
                        type: string
                        example: 2022-01-01T00:00:00Z
                        description: The time till which this approval is valid. The bay is blocked for the vehicle till this time. Typically 2 minutes for each request.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/DataNotFound'
        '410':
          $ref: '#/components/responses/NoBayAvailable'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
                    
  /partner/v1/parking/request-exit:
    post:
      tags: 
        - Parking Operations
      summary: Api for requesting exit of a vehicle
      description: "Aeria will handle the authorization based on the pre registered vehicle and the exit time. For successful authorization, Aeria will send the fare details to the partner that will be displayed on the screen at the exit and collect the fare. Idempotent replay — repeated requests for the same open session replay the prior result. For validated / tenant-covered sessions the fare reflects the coverage: zero collectible for full waivers, with a far-future validTill (e.g. 9999-12-31T23:59:59Z) so the vehicle may exit free at any time; the amount due is reconciled to the sponsoring tenant inside Aeria from the exit movement log."
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicleNo:
                  type: string
                  example: DL01AA0007
                barrierId:
                  type: string
                  example: some-barrier-id
                idempotencyKey:
                  type: string
                  maxLength: 64
                  example: lane2-entry-000123
                  nullable: true
                  description: Optional partner-supplied idempotency key, unique within your integration — any stable pattern works. Re-submissions with the same idempotencyKey return the identical response. Without it, deduplication falls back to the natural key (the vehicle's open session).
                sessionId:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
                  nullable: true
                  description: The session reference received at entry (the id from request-entry / allowEntry, or sessionId from notifyMovements), when known. Makes session resolution explicit; otherwise the vehicle's open session is resolved by plate.
              required:
                - vehicleNo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  data:
                    $ref: '#/components/schemas/ExitData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /partner/v1/parking/movement-logs:
    post:
      tags: 
        - Parking Operations
      summary: Log the entry and exit of a vehicle
      description: "Partner reports every actual entry and exit — both online-authorized and offline-decided movements — singly or in batches. Items are idempotent: resubmissions with the same id (or the same vehicleNo, time and type) are reconciled, never duplicated."
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: 00000000-0000-0000-0000-000000000000
                    description: Partner's unique identifier for THIS movement, used for idempotent reconciliation — one per physical movement. Never reuse a session reference across entry and exit; the session correlation, if needed, is separate.
                  vehicleNo:
                    type: string
                    example: DL01AA0007
                  time:
                    type: string
                    example: 2022-01-01T00:00:00Z
                  type:
                    type: string
                    example: entry
                    anyOf:
                      - type: string
                        enum: [ entry, exit ]
                  categoryId:
                    type: string
                    example: 00000000-0000-0000-0000-000000000000
                  barrierId:
                    type: string
                    example: some-barrier-id
                    description: The barrier the movement occurred at. Supply when available; engagements that enable gate-wise revenue attribution verify its presence during UAT.
                  collection:
                    $ref: '#/components/schemas/Collection'
                required:
                  - vehicleNo
                  - time
                  - type
                  - categoryId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Success
                      code:
                        type: integer
                        example: 0
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: 00000000-0000-0000-0000-000000000000
                              description: vehicle log id
                            registrationNumber:
                              type: string
                              example: MH01AB1234
                              description: registration number
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /partner/v1/parking/manual-exit:
    post:
      tags: 
        - Parking Operations
      summary: Api for manual exit of a vehicle
      description: "Api for manual exit of a vehicle whose entry record is missing or inconsistent. The response prescribes the fare; the amount actually collected is reported via movement-logs like any other exit and reconciles onto the same session (idempotent by vehicleNo, time and type)."
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicleNo:
                  type: string
                  example: DL01AA0007
                entryTime:
                  type: string
                  example: 2022-01-01T00:00:00Z
                exitTime:
                  type: string
                  example: 2022-01-01T02:00:00Z
                remark:
                  type: string
                  example: "Manual exit"
                barrierId:
                  type: string
                  example: some-barrier-id
                idempotencyKey:
                  type: string
                  maxLength: 64
                  example: lane2-entry-000123
                  nullable: true
                  description: Optional partner-supplied idempotency key, unique within your integration — any stable pattern works. Re-submissions with the same idempotencyKey return the identical response. Without it, deduplication falls back to the natural key (vehicle, entry time, exit time).
              required:
                - vehicleNo
                - entryTime
                - exitTime
                - barrierId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  data:
                    $ref: '#/components/schemas/ExitData'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
# Webhook Operations
                    
  /<webhook:allowEntry>:
    post:
      tags: 
        - Webhook Operations
      summary: Allow entry of a vehicle at the barrier
      description: "Aeria will send a request to the partner to allow entry of a vehicle at the barrier — either app/support-initiated, or as the asynchronous completion of a request-entry that could not be authorized immediately (e.g. a guard decision on the category choice was pending). It carries the decision context of a successful request-entry response (session, bay, category, settlement horizon). Invariant: an allow push is sent only when nothing remains to collect at the lane — fare-based cases never defer, since the synchronous response carries the amount and the lane can collect and admit on the spot."
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                registrationNumber:
                  type: string
                  example: MH01AB1234
                validTill:
                  type: string
                  example: 2022-01-01T00:00:00Z
                barrierId:
                  type: string
                  example: barrier1-0000-0000-0000-000000000000
                paidUpto:
                  type: string
                  example: 2022-01-01T04:00:00Z
                  nullable: true
                  description: The settlement horizon of the session being authorized — far-future means free exit (entitled/covered); absent means dues accrue from entry. Subsequent changes are pushed via updateVehicleStatus.
                sessionId:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
                  description: The session reference (as a successful request-entry response would return), for correlation — generate your own per-movement identifier when reporting the movement
                bay:
                  description: The bay to display at the lane, as in the request-entry response
                  allOf:
                    - $ref: '#/components/schemas/Bay'
                category:
                  description: The resolved category, as in the request-entry response
                  allOf:
                    - $ref: '#/components/schemas/Category'
              required:
                - registrationNumber
                - validTill
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /<webhook:allowExit>:
    post:
      tags: 
        - Webhook Operations
      summary: Allow exit of a vehicle at the barrier
      description: "Aeria will send a request to the partner to allow exit of a vehicle at the barrier — either app/support-initiated, or as the asynchronous completion of a request-exit (e.g. the payment was completed in-app after the vehicle reached the barrier). Invariant: an allow push is sent only when nothing remains to collect at the lane — fare-based cases never defer, since the synchronous request-exit response carries the fare and the lane can collect and release on the spot. totalFare is carried for display/receipt."
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                registrationNumber:
                  type: string
                  example: MH01AB1234
                vehicleType:
                  type: string
                  example: 4w
                  anyOf:
                    - type: string
                      enum: [ 4w, 2w ]
                totalFare:
                  type: number
                  example: 100
                  description: The session's total fare, for display/receipt — already fully settled when this push is sent
                validTill:
                  type: string
                  example: 2022-01-01T00:00:00Z
                barrierId:
                  type: string
                  example: some-barrier-id
                sessionId:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
                  description: The session reference (as the request-exit response would return), for correlation — generate your own per-movement identifier when reporting the movement
                categoryId:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
              required:
                - registrationNumber
                - vehicleType
                - totalFare
                - validTill
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /<webhook:addWhitelistReservedUser>:
    post:
      tags: 
        - Webhook Operations
      summary: Add a user to the whitelist, update the registration numbers and parallel entries if already present
      description: Aeria will send a request to the partner to add a user to the whitelist
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                integrationId:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
                userId:
                  type: string
                  example: user1-0000-0000-0000-000000000000
                allowedRegistartionNumbers:
                  type: array
                  items:
                    type: string
                    example: MH01AB1234
                vehicleType:
                  type: string
                  example: 4w
                  anyOf:
                    - type: string
                      enum: [ 4w, 2w ]
                validFrom:
                  type: string
                  example: 2022-01-01T00:00:00Z
                validTill:
                  type: string
                  example: 9999-12-31T23:59:59Z
                bay:
                  description: The bay to be alloted to the user when booking
                  $ref: '#/components/schemas/Bay'
              required:
                - integrationId
                - userId
                - allowedRegistartionNumbers
                - bay
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /<webhook:addWhitelistFlexiUser>:
    post:
      tags: 
        - Webhook Operations
      summary: Add a user to the whitelist for flexi parking
      description: Aeria will send a request to the partner to add a user to the whitelist
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                integrationId:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
                userId:
                  type: string
                  example: user1-0000-0000-0000-000000000000
                allowedRegistartionNumbers:
                  type: array
                  items:
                    type: string
                    example: MH01AB1234
                vehicleType:
                  type: string
                  example: 4w
                  anyOf:
                    - type: string
                      enum: [ 4w, 2w ]
                validFrom:
                  type: string
                  example: 2022-01-01T00:00:00Z
                validTill:
                  type: string
                  example: 9999-12-31T23:59:59Z
                flexiCategoryIds:
                  type: array
                  items:
                    type: string
                    example: 00000000-0000-0000-0000-000000000000
                  description: Count to be deducted for flexi parking from first category with available bays
              required:
                - integrationId
                - userId
                - allowedRegistartionNumbers
                - flexiCategoryIds
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /<webhook:removeWhitelistUser>:
    post:
      tags: 
        - Webhook Operations
      summary: Remove a user from the whitelist
      description: Aeria will send a request to the partner to remove a user from the whitelist
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                integrationId:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
                userId:
                  type: string
                  example: user1-0000-0000-0000-000000000000
              required:
                - integrationId
                - userId
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /<webhook:addBooking>:
    post:
      tags: 
        - Webhook Operations
      summary: Add a booking for a user
      description: Aeria will send a request to the partner to add a booking for a user. Aeria always supplies exactly one of bay (reserved-bay booking) or categoryId (category-level booking).
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                integrationId:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
                bookingId:
                  type: string
                  example: user1-0000-0000-0000-000000000000
                allowedRegistartionNumbers:
                  type: array
                  items:
                    type: string
                    example: MH01AB1234
                vehicleType:
                  type: string
                  example: 4w
                  anyOf:
                    - type: string
                      enum: [ 4w, 2w ]
                validFrom:
                  type: string
                  example: 2022-01-01T00:00:00Z
                validTill:
                  type: string
                  example: 2022-01-01T02:00:00Z
                bay:
                  description: The reserved bay for the booking. Omit for category-level (bay-less) bookings.
                  allOf:
                    - $ref: '#/components/schemas/Bay'
                categoryId:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
                  description: For category-level bookings, the category the vehicle draws an available bay from. Aeria supplies exactly one of bay or categoryId.
              required:
                - integrationId
                - bookingId
                - allowedRegistartionNumbers
                - vehicleType
                - validFrom
                - validTill
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /<webhook:updateBooking>:
    post:
      tags:
        - Webhook Operations
      summary: Update an existing booking (extension / renewal)
      description: "Aeria will send a request to the partner to update an existing booking's validity window (and optionally plates, bay or category) — e.g. when a visitor extends the exit time from the Aeria app after paying the incremental amount. Replacement semantics per field: a supplied field replaces the stored value; an omitted optional field is preserved. When the allocation changes, Aeria supplies exactly one of bay or categoryId and the previous allocation is replaced. Entry/exit decisions from that moment follow the updated booking."
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                integrationId:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
                bookingId:
                  type: string
                  example: booking1-0000-0000-0000-000000000000
                allowedRegistartionNumbers:
                  type: array
                  items:
                    type: string
                    example: MH01AB1234
                vehicleType:
                  type: string
                  example: 4w
                  anyOf:
                    - type: string
                      enum: [ 4w, 2w ]
                validFrom:
                  type: string
                  example: 2022-01-01T00:00:00Z
                validTill:
                  type: string
                  example: 2022-01-01T04:00:00Z
                  description: The new end of the booking window
                bay:
                  description: The new reserved bay, when the allocation changes. Aeria supplies at most one of bay or categoryId.
                  allOf:
                    - $ref: '#/components/schemas/Bay'
                categoryId:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
                  description: The new category for category-level bookings, when the allocation changes
              required:
                - integrationId
                - bookingId
                - validTill
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /<webhook:removeBooking>:
    post:
      tags: 
        - Webhook Operations
      summary: Remove a booking for a user
      description: Aeria will send a request to the partner to remove a booking for a user
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                integrationId:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
                bookingId:
                  type: string
                  example: booking1-0000-0000-0000-000000000000
              required:
                - integrationId
                - bookingId
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /<webhook:updateVehicleStatus>:
    post:
      tags:
        - Webhook Operations
      summary: Proactively update the settlement status of a vehicle's open session
      description: "Aeria notifies the partner when the settlement horizon of an in-progress session changes — a mid-session in-app payment, a post-entry booking extension, or a tenant covering the visit. The update always applies to the vehicle's currently open session at the site; if no session is open (the vehicle already exited), discard it. Upsert semantics ordered by updatedAt: apply an update only if its updatedAt is newer than the last applied for that vehicle — older or duplicate deliveries are acknowledged and ignored. Advisory state sync: request-exit remains the authoritative fare source when Aeria is reachable, and absence of a push never implies absence of payment. The synced paidUpto lets the partner decide exits locally while offline and drive lane/display behaviour."
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                integrationId:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
                id:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
                  description: Aeria's session reference (as returned by request-entry), for correlation when available. The update is keyed by the vehicle's currently open session regardless.
                registrationNumber:
                  type: string
                  example: MH01AB1234
                categoryId:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
                  description: The session's current category, after any re-categorization
                paidUpto:
                  type: string
                  example: 2022-01-01T04:00:00Z
                  description: The time until which the session is settled. Far-future (e.g. 9999-12-31T23:59:59Z) means the vehicle exits free — e.g. tenant-covered.
                updatedAt:
                  type: string
                  example: 2022-01-01T01:30:00Z
                  description: When Aeria produced this status. Apply only if newer than the last applied update for the vehicle; ignore older or duplicate deliveries.
              required:
                - integrationId
                - registrationNumber
                - paidUpto
                - updatedAt
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /<webhook:notifyMovements>:
    post:
      tags:
        - Webhook Operations
      summary: Notify the partner of movements that occurred outside its channel
      description: "Aeria notifies the partner when vehicle movements (entry or exit) occur on another execution channel — e.g. a guard-operated lane — at a site where the partner also operates. Delivered singly or in batches: after a partner-side outage, Aeria collates pending notifications and delivers them together (the mirror of movement-logs batching in the other direction). Only movements the partner did not originate or witness are sent; the partner's own movement-logs reports are never echoed back. Items apply independently and are idempotent by id — duplicate deliveries are acknowledged and ignored, and each item carries its own timestamp so application is order-insensitive. Advisory — it lets the partner create the local entry record (so its lane can automate the eventual exit) or close a stale one (occupancy and anti-passback hygiene); partner-side state remains non-authoritative, and request-entry / request-exit remain the decision path."
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                integrationId:
                  type: string
                  example: 00000000-0000-0000-0000-000000000000
                movements:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 00000000-0000-0000-0000-000000000000
                        description: Aeria's stable reference for this movement — the idempotency key
                      sessionId:
                        type: string
                        example: 00000000-0000-0000-0000-000000000000
                        description: The session this movement belongs to (correlates with the id returned by request-entry and with updateVehicleStatus), when available
                      registrationNumber:
                        type: string
                        example: MH01AB1234
                      type:
                        type: string
                        example: entry
                        anyOf:
                          - type: string
                            enum: [ entry, exit ]
                      time:
                        type: string
                        example: 2022-01-01T00:00:00Z
                      categoryId:
                        type: string
                        example: 00000000-0000-0000-0000-000000000000
                      paidUpto:
                        type: string
                        example: 2022-01-01T04:00:00Z
                        nullable: true
                        description: For entry movements — the settlement horizon as of the movement, so the partner's lane can automate the eventual exit; absent means dues accrue. Subsequent changes are pushed via updateVehicleStatus.
                    required:
                      - id
                      - registrationNumber
                      - type
                      - time
              required:
                - integrationId
                - movements
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /<webhook:getLogs>:
    get:
      tags: 
        - Webhook Operations
      summary: Get the logs of the integration
      description: Aeria will send a request to the partner to get the logs of the integration
      parameters:
        - $ref: '#/components/parameters/signatureHeader'
        - in: query
          name: integrationId
          required: true
          schema:
            type: string
          description: The integration id
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
          description: The start time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
            default: now()
          description: The end time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        registrationNumber:
                          type: string
                          example: MH01AB1234
                        time:
                          type: string
                          example: 2022-01-01T00:00:00Z
                        type:
                          type: string
                          example: entry
                          anyOf:
                            - type: string
                              enum: [ entry, exit ]
                        categoryId:
                          type: string
                          example: 00000000-0000-0000-0000-000000000000
                        barrierId:
                          type: string
                          example: some-barrier-id
                          description: The barrier the movement occurred at
                        collection:
                          $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'